name: Kernel All Build (KernelSU-Next)-New
run-name: 'Release: Build SmurfKernel_v.${{ github.event.inputs.version }}_KSUN-S/N 10series'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version'
        required: true
        default: ''

env:
  BUILD_KERNEL_VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        model:
          - G970F
          - G970N
          - G973F
          - G973N
          - G975F
          - G975N
          - G977B
          - G977N
          - N970F
          - N971N
          - N975F
          - N976B
          - N976N

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set Time Zone to Asia
      run: |
        sudo timedatectl set-timezone "Asia/Singapore"
        
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git libssl-dev bc flex bison \
          libncurses5-dev libncurses-dev cpio zip unzip \
          python3 curl rsync kmod libelf-dev \
          lz4 tar openssl python3-pip \
          gcc clang
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Set build timestamp
      id: timestamp
      run: |
        echo "BUILD_KERNEL_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        echo "BUILD_TIME_ISO=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        echo "TIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

    
    - name: Set build Environment
      run: |
        echo "BUILD_KERNEL_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

    - name: Build kernel
      shell: bash
      run: |
        chmod +x buildnew.sh
        echo "🚀 Starting build for ${{ matrix.model }}"
        echo "📋 Kernel version: ${{ env.BUILD_KERNEL_VERSION }}"
        echo "🕒 Build time: ${{ env.BUILD_TIME }}"
        
        # Kirim kedua parameter: model dan version
        ./buildnew.sh -m "${{ matrix.model }}" -v "${{ env.BUILD_KERNEL_VERSION }}"

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.model }}_KernelSU-Next_${{ env.BUILD_KERNEL_VERSION }}_${{ env.TIME }}
        path: |
          papa/*.zip
          papa/*.tar
        retention-days: 7

    - name: Build summary
      run: |
        echo "✅ Build completed for ${{ matrix.model }}"
        echo "📦 Artifacts uploaded: ${{ matrix.model }}_KernelSU-Next_${{ env.BUILD_KERNEL_VERSION }}_${{ env.TIME }}"
        echo "🕒 Build time: ${{ env.BUILD_TIME }}"

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.version != ''
    
    steps:
    - name: Set release timestamp
      id: release_time
      run: |
        echo "RELEASE_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: List downloaded artifacts
      run: |
        echo "📁 Downloaded artifacts structure:"
        find artifacts -type f -name "*.zip" -o -name "*.tar" | sort
        echo ""
        echo "Total files found:"
        find artifacts -type f \( -name "*.zip" -o -name "*.tar" \) | wc -l

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: SmurfKernel ${{ github.event.inputs.version }}
        body: |
          # SmurfKernel with KernelSU-Next Build ${{ github.event.inputs.version }} - RELEASE
          
          ## Supported Devices:
          - G970F, G970N
          - G973F, G973N  
          - G975F, G975N
          - G977B, G977N
          - N970F, N971N
          - N975F, N976B, N976N
          
          ## Build Information:
          - Build Date: ${{ env.RELEASE_TIME }}
          - Commit: ${{ github.sha }}
          - Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}
          - Version: ${{ github.event.inputs.version }}
          
          ⚠️ **Note**: Flash at your own risk! ⚠️
        draft: false
        prerelease: false
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar

    - name: Release Summary
      run: |
        echo "🎉 Release created successfully!"
        echo "📝 Release Name: SmurfKernel ${{ github.event.inputs.version }}"
        echo "🏷️ Tag: ${{ github.event.inputs.version }}"
        echo "🕒 Release Time: ${{ env.RELEASE_TIME }}"
        echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}"